<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:my="http://xmlns.jcp.org/jsf/composite/mytaglib">
<h:head>
    <title>Регистрация</title>
</h:head>
<h:body>
    <h1>Регистрация нового пользователя</h1>
    <h:form>
        <my:namedinput label="Имя" property="#{user.name}" required="true"/>
        
        <my:namedinput label="Email" property="#{user.email}" required="true"
                      validatorId="emailValidator"/>
        
        <my:namedinput label="Телефон" property="#{user.phone}" required="false"
                      validatorId="phoneValidator"/>
        
        <my:namedinput label="Пароль" property="#{user.password}" required="true"/>
        
        <h:commandButton value="Зарегистрироваться" action="welcome?faces-redirect=true"/>
    </h:form>
    
    <h:link outcome="login" value="Вход для зарегистрированных пользователей"/>
</h:body>
</html>
