<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:my="http://xmlns.jcp.org/jsf/composite/mytaglib">
<h:head>
    <title>Авторизация</title>
</h:head>
<h:body>
    <h1>Вход в систему</h1>
    <h:form>
        <my:namedinput label="Email" property="#{authBean.login}" required="true"/>
        <my:namedinput label="Пароль" property="#{authBean.password}" required="true"/>
        
        <h:commandButton value="Войти" action="#{authBean.authenticate}"/>
    </h:form>
    
    <h:link outcome="register" value="Регистрация нового пользователя"/>
</h:body>
</html>
