<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite">

<my:namedinput label="Username" property="#{authBean.login}"/>
<cc:interface>
    <cc:attribute name="label" required="true"/>
    <cc:attribute name="property" required="true"/>
    <cc:attribute name="required" default="false"/>
    <cc:attribute name="validatorId" default=""/>
</cc:interface>

<cc:implementation>
    <h:outputLabel for="input" value="#{cc.attrs.label}"/>
    <h:inputText id="input" value="#{cc.attrs.property}" required="#{cc.attrs.required}">
        <f:validateRequired rendered="#{cc.attrs.required}"/>
        <f:validator validatorId="#{cc.attrs.validatorId}" rendered="#{not empty cc.attrs.validatorId}"/>
    </h:inputText>
    <h:message for="input" style="color: red; display: block;"/>
</cc:implementation>
</html>
